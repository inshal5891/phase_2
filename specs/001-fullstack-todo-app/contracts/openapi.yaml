openapi: 3.0.3
info:
  title: Todo Web Application API
  description: API for managing todo tasks in the full-stack web application
  version: 1.0.0
servers:
  - url: http://localhost:8000/api
    description: Development server
paths:
  /tasks:
    get:
      summary: Get all tasks
      description: Retrieve a list of all tasks for the user
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          description: Bad request
        '500':
          description: Internal server error
    post:
      summary: Create a new task
      description: Create a new todo task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid input
        '500':
          description: Internal server error
  /tasks/{id}:
    get:
      summary: Get a specific task
      description: Retrieve a specific task by its ID
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
        '500':
          description: Internal server error
    put:
      summary: Update a task
      description: Update an existing task with new information
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid input
        '404':
          description: Task not found
        '500':
          description: Internal server error
    delete:
      summary: Delete a task
      description: Remove a task from the system
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
      responses:
        '204':
          description: Task deleted successfully
        '404':
          description: Task not found
        '500':
          description: Internal server error
  /tasks/{id}/complete:
    patch:
      summary: Toggle task completion status
      description: Mark a task as complete or incomplete
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                completed:
                  type: boolean
                  description: The new completion status for the task
      responses:
        '200':
          description: Task completion status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid input
        '404':
          description: Task not found
        '500':
          description: Internal server error
components:
  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - completed
        - created_at
        - user_id
      properties:
        id:
          type: integer
          description: Unique identifier for the task
          example: 1
        title:
          type: string
          description: The title of the task
          example: "Buy groceries"
          maxLength: 255
        description:
          type: string
          description: Optional description of the task
          example: "Milk, eggs, bread, fruits"
          maxLength: 1000
        completed:
          type: boolean
          description: Whether the task is completed
          example: false
        created_at:
          type: string
          format: date-time
          description: Timestamp when the task was created
          example: "2026-02-05T10:30:00Z"
        user_id:
          type: integer
          description: ID of the user who owns this task
          example: 1
    CreateTaskRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: The title of the task
          example: "Buy groceries"
          minLength: 1
          maxLength: 255
        description:
          type: string
          description: Optional description of the task
          example: "Milk, eggs, bread, fruits"
          maxLength: 1000
    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          description: The new title of the task
          example: "Buy groceries"
          minLength: 1
          maxLength: 255
        description:
          type: string
          description: New description of the task
          example: "Milk, eggs, bread, fruits"
          maxLength: 1000
        completed:
          type: boolean
          description: New completion status for the task
          example: false